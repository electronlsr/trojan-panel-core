name: Publish versioned containers
on:
  push:
    branches: [main]
    paths: ['.release-version', '.github/workflows/release.yml', 'Dockerfile', 'scripts/container-smoke.sh']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
  publish:
    if: github.repository_owner == 'electronlsr' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: core-binaries-*
          merge-multiple: true
          path: build/
      - name: Read explicit release version
        id: release
        run: |
          version=$(cat .release-version)
          [[ "$version" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}([.-][a-z0-9]+)*$ ]]
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "epoch=$(git show -s --format=%ct HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published release
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "Release $IMAGE:$VERSION already exists. Bump .release-version; published releases must never be overwritten." >&2
            exit 1
          fi
      - name: Publish tested, versioned multi-platform image
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        env:
          SOURCE_DATE_EPOCH: ${{ steps.release.outputs.epoch }}
        with:
          context: .
          platforms: linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ steps.release.outputs.image }}:${{ steps.release.outputs.version }}
            ${{ steps.release.outputs.image }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.title=trojan-panel-core
      - name: Pull and smoke-test the exact registry digest
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          bash scripts/container-smoke.sh core "$IMAGE@$DIGEST"
      - name: Record exact published identity
        env:
          IMAGE: ${{ steps.release.outputs.image }}
          VERSION: ${{ steps.release.outputs.version }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          docker buildx imagetools inspect "$IMAGE@$DIGEST" | tee image-manifest.txt
          python - <<'PYCODE'
          import json, os
          record = {'image': os.environ['IMAGE'], 'tag': os.environ['VERSION'], 'digest': os.environ['DIGEST'], 'revision': os.environ['GITHUB_SHA'], 'platforms': 'linux/386,linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64,linux/ppc64le,linux/s390x'.split(',')}
          with open('release-image.json', 'w') as output:
              json.dump(record, output, indent=2)
          PYCODE
          echo "### Published image" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$IMAGE:$VERSION@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Public anonymous pulling must be independently checked after package visibility is set to public." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-image
          path: |
            release-image.json
            image-manifest.txt
          retention-days: 90
